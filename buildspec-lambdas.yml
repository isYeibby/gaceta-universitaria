version: 0.2

phases:
  build:
    commands:
      - |
        for func in actualizarNoticia agregarNoticia cognito-auth eliminarNoticia generarURLfirmada obtenerNoticias suscribirNoticias; do
          echo "Empaquetando y actualizando: $func"
          (cd "lambdas/$func" && zip -qr "/tmp/${func}.zip" .)
          aws lambda update-function-code \
            --region us-east-2 \
            --function-name "$func" \
            --zip-file "fileb:///tmp/${func}.zip"
        done